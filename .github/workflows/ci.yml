name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SYNCTHING_VERSION: v2.1.5

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go vet -tags integration,compose,loadsim ./test/...
      - run: go test -race ./...
      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/syncwatch
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/syncwatch

  integration:
    # Real Syncthing processes: 3 servers, 2 PCs, a fake Discord webhook.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Download Syncthing
        run: |
          curl -fsSL -o st.tgz "https://github.com/syncthing/syncthing/releases/download/${SYNCTHING_VERSION}/syncthing-linux-amd64-${SYNCTHING_VERSION}.tar.gz"
          tar xzf st.tgz
          echo "SYNCTHING_BIN=$PWD/syncthing-linux-amd64-${SYNCTHING_VERSION}/syncthing" >> "$GITHUB_ENV"
      - run: go test -tags integration -v -count=1 -timeout 30m ./test/integration

  compose:
    # The Docker image with real Syncthing containers (2 servers, 1 PC) and a
    # fake Discord webhook, driven by Docker Compose.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -tags compose -v -count=1 -timeout 30m ./test/compose
      - name: Logs on failure
        if: failure()
        run: docker compose -f test/compose/docker-compose.yml logs --no-color | tail -n 300
