name: Release

on:
  push:
    tags: ["v*"]

# Each job gets only the permissions that it needs. The actions have commit
# SHAs (the comment names the release) because this workflow can make images
# available. The checkouts keep no secrets, and the jobs that make the
# release use no build cache of other runs. Thus data from other runs cannot
# get into a release.
permissions:
  contents: read

jobs:
  # The release waits for the tests of the tagged commit.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The check build is the same build as the last step of this job. It
      # writes the files of each image into a local directory, with 1
      # subdirectory for each platform (linux_amd64, linux_arm64).
      - name: Build the image for the architecture check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/image
      - name: Check the architecture of each image
        # Each image must contain the program for its platform. A default
        # value of TARGETARCH in the Dockerfile put the amd64 program into the
        # arm64 image before. "file" reads the header of the program and does
        # not start it. Thus the check needs no emulation.
        run: |
          for pair in "linux_amd64=, x86-64," "linux_arm64=, ARM aarch64,"; do
            dir=${pair%%=*}; want=${pair#*=}
            got=$(file -b "$RUNNER_TEMP/image/$dir/usr/local/bin/syncwatch")
            echo "$dir: $got"
            case "$got" in
              *"$want"*) ;;
              *) echo "::error::The $dir image does not contain the program for its platform."; exit 1 ;;
            esac
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # "latest" moves only for final releases. A pre-release tag such
          # as v1.2.0-rc1 (a tag with a "-") gets its own tag only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # This step uses the layers of the check build from the cache of this
      # builder. Thus the registry gets the programs that the check examined.
      - name: Build and publish the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          # Provenance is a record of the build: the commit, the Dockerfile,
          # the base images and the build arguments. It contains no secrets.
          # It is on for the test release v0.9.0-rc1. Look at how the
          # container interfaces of NAS products (for example QNAP Container
          # Station) show the image. Keep provenance if the result is
          # satisfactory (plan.md, section 2, step 1). With provenance, the
          # image index has 1 more manifest for each platform, with the
          # platform unknown/unknown. To set provenance to off, set
          # "provenance: false". The image has no SBOM and no signature at
          # this time.
          provenance: mode=max

  binaries:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/syncwatch-${GITHUB_REF_NAME}-${os}-${arch}${ext}" ./cmd/syncwatch
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          # A tag with a "-" becomes a pre-release on GitHub.
          prerelease: ${{ contains(github.ref_name, '-') }}
