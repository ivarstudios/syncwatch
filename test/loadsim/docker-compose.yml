# Structure-scan load simulation: one Syncthing "NAS" with a large,
# IVAR-like share and the syncwatch image watching it. Driven by
# loadsim_test.go:
#
#   go test -tags loadsim -v -timeout 60m ./test/loadsim
#
# Names are under .invalid so nothing can resolve to a real server. Set
# SW_E2E_BIND=0.0.0.0 when Docker runs in a VM (see test/compose).
name: syncwatch-loadsim

services:
  load-nas:
    image: syncthing/syncthing:2.1.5
    hostname: nas.load.invalid
    networks:
      default:
        aliases: [nas.load.invalid]
    healthcheck:
      disable: true
    environment:
      PUID: "1000"
      PGID: "1000"
      STGUIADDRESS: https://0.0.0.0:8384
      STNOUPGRADE: "1"
      STNODEFAULTFOLDER: "1"
      STGUIAPIKEY: key-load-0123456789
    ports: ["${SW_E2E_BIND:-127.0.0.1}:18711:8384"]
    # Same init step as test/compose/docker-compose.yml: everything that
    # reaches outside the test network is off before the first start, and
    # Syncthing refuses to start if any of it is on.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        C="$${STHOMEDIR:-/var/syncthing/config}"
        if [ ! -f "$$C/config.xml" ]; then
          chown "$$PUID:$$PGID" "$$HOME" || true
          su-exec "$$PUID:$$PGID" env HOME="$$HOME" /bin/syncthing generate --home="$$C" --no-port-probing
        fi
        su-exec "$$PUID:$$PGID" sed -i \
          -e 's|<globalAnnounceEnabled>true<|<globalAnnounceEnabled>false<|' \
          -e 's|<localAnnounceEnabled>true<|<localAnnounceEnabled>false<|' \
          -e 's|<relaysEnabled>true<|<relaysEnabled>false<|' \
          -e 's|<natEnabled>true<|<natEnabled>false<|' \
          -e 's|<urAccepted>0<|<urAccepted>-1<|' \
          -e 's|<autoUpgradeIntervalH>[0-9]*<|<autoUpgradeIntervalH>0<|' \
          -e 's|<crashReportingEnabled>true<|<crashReportingEnabled>false<|' \
          "$$C/config.xml"
        for k in globalAnnounceEnabled localAnnounceEnabled relaysEnabled natEnabled crashReportingEnabled; do
          grep -q "<$$k>false</$$k>" "$$C/config.xml" || { echo "syncthing-init: $$k is not off; refusing to start" >&2; exit 1; }
        done
        grep -q '<urAccepted>-1</urAccepted>' "$$C/config.xml" || { echo "syncthing-init: usage reporting is not off; refusing to start" >&2; exit 1; }
        grep -q '<autoUpgradeIntervalH>0</autoUpgradeIntervalH>' "$$C/config.xml" || { echo "syncthing-init: auto-upgrade is not off; refusing to start" >&2; exit 1; }
        echo "syncthing-init: discovery, relays, NAT traversal, usage and crash reporting and auto-upgrade are off" >&2
        exec /bin/entrypoint.sh /bin/syncthing

  init:
    image: alpine:3
    volumes:
      - swdata:/data
    environment:
      CONFIG: |
        timezone: Europe/Stockholm
        servers:
          - name: NAS
            url: https://nas.load.invalid:8384
            api_key: key-load-0123456789
        collector:
          structure_interval: 1m
          baseline_interval: 7d
          concurrency: 3
        structure:
          project_pattern: '^LIVE-'
          share_type_from_path: '-LIVE-(?P<type>[1-5][A-Z]+)$'
          type_tokens: [1SOURCE, 2PROJECTFILES]
        notifications:
          quiet_hours: "off"
          reminder_time: "off"
          weekly_day: "off"
        api:
          token: swt_loadsim_token_0123456789
    command: ["sh", "-c", "printf '%s' \"$$CONFIG\" > /data/syncwatch.yaml && chmod 600 /data/syncwatch.yaml && chown -R 65532:65532 /data"]

  syncwatch:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: loadsim
    image: syncwatch:loadsim
    read_only: true
    tmpfs: [/tmp]
    environment:
      TZ: Europe/Stockholm
      SYNCWATCH_ADMIN_PASSWORD: loadsim-admin-password
    volumes:
      - swdata:/data
    ports: ["${SW_E2E_BIND:-127.0.0.1}:18781:8386"]
    depends_on:
      init: { condition: service_completed_successfully }

volumes:
  swdata:
