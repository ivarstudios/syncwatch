# Minimal configuration: one or more servers and a Discord webhook. Each
# check that needs no structure rules works without more configuration.
# These are: health, Syncthing folders inside others, share roots as
# Syncthing folders, duplicate names, project folders not in Syncthing, cleanup.
public_url: https://monitor.lan:8080
timezone: Europe/Berlin
servers:
  - name: nas1
    url: https://nas1.lan:8384
    api_key: CHANGE-ME
  - name: nas2
    url: https://nas2.lan:8384
    api_key: CHANGE-ME
notifications:
  discord_webhook: https://discord.com/api/webhooks/CHANGE/ME
