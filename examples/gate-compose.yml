# The read-only gate on one NAS (example: SOL, QNAP Container Station).
# The gate keeps the Syncthing API key of this server. That key can change
# all data. syncwatch only gets a gate token. The gate token reaches only
# the read-only endpoints that syncwatch uses. Run one gate on each NAS
# that syncwatch monitors.
#
# 1. mkdir -p /share/CACHEDEV1_DATA/Containers/syncwatch-gate/data
#    chown 1000:1000 /share/CACHEDEV1_DATA/Containers/syncwatch-gate/data
#    The user: line below gives the user. The user also needs read access
#    to config.xml and to data/syncthing.pin.
# 2. Change the 2 paths, the user and the LAN address (3 lines) below.
# 3. docker compose up -d
#    `docker logs syncwatch-gate` shows the gate token one time. The gate
#    token is also in data/gate-token.
# 4. In syncwatch, open Settings → Servers → SOL. Type the API URL
#    https://192.168.2.10:8385 and the gate token as the API key. syncwatch
#    pins the gate certificate the same as a Syncthing certificate.
# 5. Port 8384 (the Syncthing GUI) does not need to be open to the syncwatch
#    host now. Port 8385 must be open.
services:
  syncwatch-gate:
    image: ghcr.io/ivarstudios/syncwatch:1.0.0   # also use the digest (README → Updates)
    command: ["gate"]
    container_name: syncwatch-gate
    restart: unless-stopped
    # The Syncthing user (its PUID and PGID). Then the gate can read config.xml.
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Syncthing runs on the host network. The gate also does, to reach the
    # GUI on 127.0.0.1 (accepted without a pinned certificate: the same host).
    network_mode: host
    environment:
      - SYNCWATCH_GATE_LISTEN=192.168.2.10:8385       # the LAN address of the NAS
      - SYNCWATCH_TLS_HOSTS=192.168.2.10
      - SYNCWATCH_HEALTHCHECK_URL=https://192.168.2.10:8385/healthz   # for the healthcheck of the image
      - SYNCWATCH_GATE_SYNCTHING=https://127.0.0.1:8384
      - SYNCWATCH_GATE_SYNCTHING_CONFIG=/syncthing/config.xml
      # The structure scan can list the parents of the Syncthing folders and
      # the directories under them. Put directories from shares.add in
      # syncwatch that are in a different location here, comma-separated:
      # - SYNCWATCH_GATE_BROWSE_ROOTS=/share/CACHEDEV1_DATA/Extra
    volumes:
      - /share/CACHEDEV1_DATA/Containers/syncwatch-gate/data:/data
      # The config.xml of Syncthing, read-only. The gate reads the API key
      # from it. Thus there is no copy of the key in a different location.
      - /share/CACHEDEV1_DATA/Containers/syncthing/config/config.xml:/syncthing/config.xml:ro
    labels:
      - com.centurylinklabs.watchtower.enable=false
