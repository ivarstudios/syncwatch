# Example configuration of IVAR Studios for syncwatch.
#
# Put this file at /data/syncwatch.yaml before the first start. syncwatch
# imports it one time. Or import it later under Settings → Export and import.
# You can add the API keys here for the first import. syncwatch then encrypts
# them in the database and never exports them.

public_url: https://192.168.1.10:8080
timezone: Europe/Stockholm

servers:
  - name: AKKA
    url: https://192.168.1.10:8384
    # api_key: …
  - name: SOL
    url: https://192.168.2.10:8384
  - name: SIRIUS
    url: https://192.168.3.10:8384

collector:
  mode: events            # use "polled" if the probe shows a large load on the NAS hardware
  event_timeout: 50s      # below the idle timeout of the VPN
  full_check_interval: 4h
  structure_interval: 1h

notifications:
  # discord_webhook: https://discord.com/api/webhooks/…
  discord_role_id: ""     # the numeric ID (17 to 20 digits) of the role to mention in urgent messages
  quiet_hours: "22:00-07:00"
  reminder_time: "08:00"  # must be outside the evening part of the quiet hours
  weekly_day: monday
  weekly_time: "08:00"

# The structure rules of IVAR.
#   Shares:          <NAS>-LIVE-<n><TYPE> and <NAS>-ME-LIVE-<n><TYPE>
#   Project folders: LIVE-<PROJECT>[-…] and ME-LIVE-<PROJECT>[-…] at the top of a share.
#                    A project folder name usually includes the type token of the share.
structure:
  project_pattern: '^(ME-)?LIVE-[A-Za-z0-9]'
  share_type_from_path: '-(?P<me>ME-)?LIVE-(?P<type>[1-5][A-Z]+)$'
  type_tokens: [1SOURCE, 2PROJECTFILES, 3INTERMEDIATE, 4FINALS, 5COLLECT]
  placement:
    - when_name_matches: '^ME-LIVE-'
      share_must_have: { me: true }       # me must be a named group of share_type_from_path
    - when_name_matches: '^LIVE-'
      share_must_have: { me: false }
  ignore_dirs: ['@Recycle', '@Recently-Snapshot', '.streams', '.@__thumb', '@eaDir', '.stversions', '.stfolder', '.*', '#recycle']
  nested_scan_depth: 3

shares:
  # Shares that have no Syncthing folder until now, but that syncwatch must check.
  # Behind a read-only gate, these directories also go into SYNCWATCH_GATE_BROWSE_ROOTS.
  add:
    SIRIUS: [/share/CACHEDEV2_DATA/SIRIUS-LIVE-5COLLECT]
  exclude: {}
