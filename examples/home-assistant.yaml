      #   unit_of_measurement: MB/s
      #   availability: "{{ value_json is mapping and 'sirius' in value_json.get('servers', {}) }}"
      #   value_template: "{{ value_json.servers['sirius'].upload_mb_s }}"

  # The count of urgent findings that are open and not snoozed, from the
  # status API. Use this sensor for automations. The status of a server can
  # show "syncing" or "error" for a short time without a finding.
  - resource: https://192.168.1.10:8080/api/v1/status
    headers:
      Authorization: !secret syncwatch_auth
    verify_ssl: false
    scan_interval: 60
    timeout: 20
    sensor:
      - name: syncwatch urgent findings
        unique_id: syncwatch_urgent
        icon: mdi:alert
        state_class: measurement
        availability: "{{ value_json is mapping and 'counts' in value_json }}"
        value_template: "{{ value_json.counts.urgent }}"
        json_attributes: [health, counts]
