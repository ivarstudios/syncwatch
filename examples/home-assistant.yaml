# Home Assistant sensors from syncwatch, for 3 servers (AKKA, SOL and
# SIRIUS, as in examples/ivar.yaml).
# Paste this block into configuration.yaml (or a package). Write the API
# token in secrets.yaml:
#
#   syncwatch_auth: "Bearer swt_…"     # Settings → API in syncwatch
#
# One request each minute reads each server from /api/v1/ha of syncwatch.
# The keys under value_json.servers are the server IDs of syncwatch
# (Settings → Servers). Always write them as servers['<id>']. An ID can have
# a hyphen (a server named "NAS 1" gets the ID nas-1), and servers.nas-1 is a
# subtraction in a Jinja template. For each server you get 6 entities: a
# binary sensor (the server answers) and the status. Also the data moved in
# the last 24 hours and in 7 days, and the download and upload speed. The
# data sensors have the attributes received and sent. Remove the
# sensors of a server that you do not have: a missing key logs a template
# error each minute. Home Assistant never gets a Syncthing API key. The API
# token of syncwatch is read-only. The request goes to an IP address. A
# request by a host name needs that name in SYNCWATCH_TLS_HOSTS of syncwatch.
rest:
  - resource: https://192.168.1.10:8080/api/v1/ha
    headers:
      Authorization: !secret syncwatch_auth
    verify_ssl: false          # the self-signed certificate of syncwatch
    scan_interval: 60
    timeout: 20
    binary_sensor:
      - name: AKKA Syncthing running
        unique_id: syncwatch_akka_running
        device_class: running
        value_template: "{{ value_json.servers['akka'].running }}"
      - name: SOL Syncthing running
        unique_id: syncwatch_sol_running
        device_class: running
        value_template: "{{ value_json.servers['sol'].running }}"
      - name: SIRIUS Syncthing running
        unique_id: syncwatch_sirius_running
        device_class: running
        value_template: "{{ value_json.servers['sirius'].running }}"
    sensor:
      # AKKA
      - name: AKKA Syncthing status
        unique_id: syncwatch_akka_status
        icon: mdi:sync
        value_template: "{{ value_json.servers['akka'].status }}"
        json_attributes_path: "$.servers['akka']"
        json_attributes: [folders, folders_syncing, folders_scanning, folders_error, folders_watch_error, folders_paused]
      - name: AKKA data moved 24 h
        unique_id: syncwatch_akka_moved_24h
        device_class: data_size
        state_class: measurement
        unit_of_measurement: GB
        value_template: "{{ value_json.servers['akka'].moved_24h_gb }}"
        json_attributes_path: "$.servers['akka']"
        json_attributes: [received_24h_gb, sent_24h_gb]
      - name: AKKA data moved 7 days
        unique_id: syncwatch_akka_moved_7d
        device_class: data_size
        state_class: measurement
        unit_of_measurement: GB
        value_template: "{{ value_json.servers['akka'].moved_7d_gb }}"
        json_attributes_path: "$.servers['akka']"
        json_attributes: [received_7d_gb, sent_7d_gb]
      - name: AKKA download speed
        unique_id: syncwatch_akka_download
        device_class: data_rate
        state_class: measurement
        unit_of_measurement: MB/s
        value_template: "{{ value_json.servers['akka'].download_mb_s }}"
      - name: AKKA upload speed
        unique_id: syncwatch_akka_upload
        device_class: data_rate
        state_class: measurement
        unit_of_measurement: MB/s
        value_template: "{{ value_json.servers['akka'].upload_mb_s }}"
      # SOL
      - name: SOL Syncthing status
        unique_id: syncwatch_sol_status
        icon: mdi:sync
        value_template: "{{ value_json.servers['sol'].status }}"
        json_attributes_path: "$.servers['sol']"
        json_attributes: [folders, folders_syncing, folders_scanning, folders_error, folders_watch_error, folders_paused]
      - name: SOL data moved 24 h
        unique_id: syncwatch_sol_moved_24h
        device_class: data_size
        state_class: measurement
        unit_of_measurement: GB
        value_template: "{{ value_json.servers['sol'].moved_24h_gb }}"
        json_attributes_path: "$.servers['sol']"
        json_attributes: [received_24h_gb, sent_24h_gb]
      - name: SOL data moved 7 days
        unique_id: syncwatch_sol_moved_7d
        device_class: data_size
        state_class: measurement
        unit_of_measurement: GB
        value_template: "{{ value_json.servers['sol'].moved_7d_gb }}"
        json_attributes_path: "$.servers['sol']"
        json_attributes: [received_7d_gb, sent_7d_gb]
      - name: SOL download speed
        unique_id: syncwatch_sol_download
        device_class: data_rate
        state_class: measurement
        unit_of_measurement: MB/s
        value_template: "{{ value_json.servers['sol'].download_mb_s }}"
      - name: SOL upload speed
        unique_id: syncwatch_sol_upload
        device_class: data_rate
        state_class: measurement
        unit_of_measurement: MB/s
        value_template: "{{ value_json.servers['sol'].upload_mb_s }}"
      # SIRIUS
      - name: SIRIUS Syncthing status
        unique_id: syncwatch_sirius_status
        icon: mdi:sync
        value_template: "{{ value_json.servers['sirius'].status }}"
        json_attributes_path: "$.servers['sirius']"
        json_attributes: [folders, folders_syncing, folders_scanning, folders_error, folders_watch_error, folders_paused]
      - name: SIRIUS data moved 24 h
        unique_id: syncwatch_sirius_moved_24h
        device_class: data_size
        state_class: measurement
        unit_of_measurement: GB
        value_template: "{{ value_json.servers['sirius'].moved_24h_gb }}"
        json_attributes_path: "$.servers['sirius']"
        json_attributes: [received_24h_gb, sent_24h_gb]
      - name: SIRIUS data moved 7 days
        unique_id: syncwatch_sirius_moved_7d
        device_class: data_size
        state_class: measurement
        unit_of_measurement: GB
        value_template: "{{ value_json.servers['sirius'].moved_7d_gb }}"
        json_attributes_path: "$.servers['sirius']"
        json_attributes: [received_7d_gb, sent_7d_gb]
      - name: SIRIUS download speed
        unique_id: syncwatch_sirius_download
        device_class: data_rate
        state_class: measurement
        unit_of_measurement: MB/s
        value_template: "{{ value_json.servers['sirius'].download_mb_s }}"
      - name: SIRIUS upload speed
        unique_id: syncwatch_sirius_upload
        device_class: data_rate
        state_class: measurement
        unit_of_measurement: MB/s
        value_template: "{{ value_json.servers['sirius'].upload_mb_s }}"
